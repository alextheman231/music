name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 0 21 * * 5

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    if: ${{ github.repository == 'alextheman231/music' }}
    uses: alextheman231/github-actions/.github/workflows/update-dependencies.yml@77bb6d670a2c8c1d90b6571c93787f37dafb2e19 # v13.0.1
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      update_actions: true
      body-path: .github/pull_request_template.md
