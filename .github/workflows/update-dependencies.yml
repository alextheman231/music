name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * 1

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    if: ${{ github.repository == 'alextheman231/music' }}
    uses: alextheman231/github-actions/.github/workflows/update-dependencies.yml@e4a57e8e6d27f037427b8d4c801f60e5b4577d16 # v14.6.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      update_actions: true
      body-path: .github/pull_request_template.md
