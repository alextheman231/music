name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * 1

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    if: ${{ github.repository == 'alextheman231/music' }}
    uses: alextheman231/github-actions/.github/workflows/update-dependencies.yml@a4cd17127c4594f368ca998731dc825f3dbd051b # v14.5.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      update_actions: true
      body-path: .github/pull_request_template.md
