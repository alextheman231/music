name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@e4a57e8e6d27f037427b8d4c801f60e5b4577d16 # v14.6.0

  secret-scan-ci:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/secret-scan-ci.yml@e4a57e8e6d27f037427b8d4c801f60e5b4577d16 # v14.6.0
    with:
      github-push-before-sha: ${{ github.event.before }}
      github-push-base-sha: ${{ github.event.base_ref }}
      github-pull-base-sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
